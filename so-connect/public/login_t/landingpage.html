<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Landing Page</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #eef2f7, #dfe9f3);
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

/* VIDEO BOX */
.video-box {
    width: 100%;
    height: 250px;
    background: #e0e0e0;
    border-radius: 20px;
    margin-bottom: 40px;
}

/* CARDS */
.cards {
    display: flex;
    gap: 20px;

    /* ✅ FIXED: prevents cards from moving */
    align-items: flex-start;
}

/* CARD */
.card {
    flex: 1;
    background: linear-gradient(180deg, #4caf50 , #66bb6a);
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    cursor: pointer;

    /* ✅ keeps size stable */
    min-height: 120px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center ;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);

    /* smooth animation */
    transition: transform 0.35s ease, background 0.3s ease;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

/* ONLY ACTIVE MOVES */
.card.active {
    transform: translateY(-25px);
    background: white ;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

/* HIDDEN CONTENT */
.card-content {
    opacity: 0;
    max-height: 0;
    overflow: hidden;

    transition: all 0.4s ease;
}

/* SHOW CONTENT SMOOTHLY */
.card.active .card-content {
    opacity: 1;
    max-height: 200px;
}

/* BUTTON */
button {
     margin-top: 15px;
    padding: 10px 18px;
    border: none;
    border-radius: 12px;

    background: linear-gradient(135deg, #4caf50, #66bb6a);
    color: white;

    font-weight: bold;
    cursor: pointer;

    transition: 0.3s;
}
    @media (max-width: 900px) {
    .cards {
        flex-direction: column;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="video-box"></div>

    <div class="cards">

        <div class="card" onclick="selectCard(this)">
            <h3>Plan 1</h3>
            <div class="card-content">
                <p>Feature 1</p>
                <p>Feature 2</p>
                <p>Feature 3</p>
                <button>Join</button>
            </div>
        </div>

        <div class="card" onclick="selectCard(this)">
            <h3>Plan 2</h3>
            <div class="card-content">
                <p>Feature 1</p>
                <p>Feature 2</p>
                <p>Feature 3</p>
                <button>Join</button>
            </div>
        </div>

        <div class="card" onclick="selectCard(this)">
            <h3>Plan 3</h3>
            <div class="card-content">
                <p>Feature 1</p>
                <p>Feature 2</p>
                <p>Feature 3</p>
                <button>Join</button>
            </div>
        </div>

        <div class="card" onclick="selectCard(this)">
            <h3>Plan 4</h3>
            <div class="card-content">
                <p>Feature 1</p>
                <p>Feature 2</p>
                <p>Feature 3</p>
                <button>Join</button>
            </div>
        </div>

    </div>

</div>

<script>
function selectCard(card) {
    document.querySelectorAll('.card').forEach(c =>
        c.classList.remove('active')
    );
    card.classList.add('active');
}
</script>

</body>
</html>
