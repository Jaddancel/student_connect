<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Super Admin</title>
    <link rel="stylesheet" href="../superadmin/css/super.css">
</head>

<body>

    <main class="main" style="width: 100%;">
        <div class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3>System Settings</h3>
            </div>
            <a href="super_dashboard.html" class="btn-blue" style="text-decoration: none; padding: 8px 16px; border-radius: 6px; display: inline-block; color: white;">← Back to Dashboard</a>
        </div>

        <section class="grid">
                <div class="card" style="grid-column: 1 / -1;">
                    <h3>General Settings</h3>
                    <form>
                        <label>System Name</label>
                        <input type="text" value="Student Connect" required>

                        <label>System Email</label>
                        <input type="email" value="admin@studentconnect.com" required>

                        <label>Support Email</label>
                        <input type="email" value="support@studentconnect.com" required>

                        <button type="submit" style="background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">Save Changes</button>
                    </form>
                </div>

                <div class="card" style="grid-column: 1 / -1;">
                    <h3>Notification Settings</h3>
                    <form>
                        <label>
                            <input type="checkbox" checked> Send email on new registrations
                        </label>
                        <label>
                            <input type="checkbox" checked> Send email on approvals
                        </label>
                        <label>
                            <input type="checkbox"> Send weekly reports
                        </label>

                        <button type="submit" style="background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px;">Save Settings</button>
                    </form>
                </div>

                <div class="card" style="grid-column: 1 / -1;">
                    <h3>Data Management</h3>
                    <p>Backup and archive system data.</p>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn-blue">Backup Database</button>
                        <button class="btn-green">Archive Old Data</button>
                        <button class="btn-red">Clear Cache</button>
                    </div>
                </div>
            </section>

    </main>

</body>

</html>
