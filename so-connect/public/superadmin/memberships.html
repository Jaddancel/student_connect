<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memberships - Super Admin</title>
    <link rel="stylesheet" href="../superadmin/css/super.css">
</head>

<body>

    <main class="main" style="width: 100%;">
        <div class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3>Membership Data & Export</h3>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
                <button class="btn-blue" onclick="downloadMembersCSV()">Download CSV</button>
                <button class="btn-green" onclick="downloadMembersExcel()">Download Excel</button>
                <a href="super_dashboard.html" class="btn-blue" style="text-decoration: none; padding: 8px 16px; border-radius: 6px; display: inline-block; color: white;">← Back</a>
            </div>
        </div>

            <section class="grid">
                <div class="card" style="grid-column: 1 / -1;">
                    <h3>All Members</h3>
                    <input type="text" placeholder="Search members..." oninput="filterMembers(this.value)" style="margin-bottom:15px;">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Member Name</th>
                                    <th>Email</th>
                                    <th>Organization</th>
                                    <th>Join Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="membersTable">
                                <tr>
                                    <td>John Smith</td>
                                    <td>john@uni.edu</td>
                                    <td>CompSci Club</td>
                                    <td>2026-01-15</td>
                                    <td>Active</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

    </main>

    <script>
        function downloadMembersCSV(){ alert('Downloading members CSV (placeholder)'); }
        function downloadMembersExcel(){ alert('Downloading members Excel (placeholder)'); }
        function filterMembers(q){ /* implement client-side filter later */ }
    </script>

</body>

</html>

</body>
