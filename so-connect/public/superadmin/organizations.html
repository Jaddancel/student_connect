<!DOCTYPE html>
<html lang="en">

<head>

    <title>Organizations - Super Admin</title>
    <link rel="stylesheet" href="../superadmin/css/super.css">
</head>

<body>

    <main class="main" style="width: 100%;">
        <div class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3>Organization Directory</h3>
            </div>
            <a href="super_dashboard.html" class="btn-blue" style="text-decoration: none; padding: 8px 16px; border-radius: 6px; display: inline-block; color: white;">← Back to Dashboard</a>
        </div>

            <section class="grid">
                <div class="card" style="grid-column: 1 / -1;">
                    <h3>All Organizations</h3>

                        <table>

                                <tr>
                                    <th>Organization Name</th>

                            <tbody>
                                <tr>
                                    <td>CompSci Club</td>
                                    <td>coach@uni.edu</td>

                                    <td><button class="btn-green btn-sm">Manage</button></td>
                                </tr>
                                <tr>
                                    <td>Engineering Society</td>
                                    <td>eng@uni.edu</td>
                                    <td>65</td>
                                    <td>Active</td>
                                    <td><button class="btn-green btn-sm">Manage</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

    </main>

</body>

</html>
