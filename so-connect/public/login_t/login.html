<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="flip-container">
        <div class="flip-box" id="flipBox">
            <!-- Front Side - Login Form -->
            <div class="flip-front">
                <div class="form-container">
                    <h1>Login</h1>
                    <form action="/login" method="POST">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn-submit">Login</button>
                    </form>
                    <button type="button" class="btn-toggle" onclick="toggleFlip()">Don't have account? Register</button>
                </div>
            </div>

            <!-- Back Side - Register Form -->
            <div class="flip-back">
                <div class="form-container">
                    <h1>Register</h1>
                    <form action="/register" method="POST">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" name="name" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="register-email">Email</label>
                            <input type="email" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="register-password">Password</label>
                            <input type="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" name="confirm_password" placeholder="Confirm your password" required>
                        </div>

                        <button type="submit" class="btn-submit">Register</button>
                    </form>
                    <button type="button" class="btn-toggle" onclick="toggleFlip()">Already registered? Login</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleFlip() {
            const flipBox = document.getElementById('flipBox');
            flipBox.classList.toggle('flip');
        }
    </script>
</body>
        </form>
        
    </div>

</body>

</html>
