<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users - Super Admin</title>
    <link rel="stylesheet" href="../superadmin/css/super.css">
</head>

<body>

    <main class="main" style="width: 100%;">
        <div class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3>User Accounts & Permissions</h3>
            </div>
            <a href="super_dashboard.html" class="btn-blue" style="text-decoration: none; padding: 8px 16px; border-radius: 6px; display: inline-block; color: white;">← Back to Dashboard</a>
        </div>

            <section class="grid">
                <div class="card" style="grid-column: 1 / -1;">
                    <h3>All Users</h3>
                    <input type="text" placeholder="Search users..." oninput="filterUsers(this.value)" style="margin-bottom:15px;">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Organization</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTable">
                                <tr>
                                    <td>Admin One</td>
                                    <td>admin@uni.edu</td>
                                    <td>Administrator</td>
                                    <td>—</td>
                                    <td><button class="btn-blue btn-sm">Edit</button></td>
                                </tr>
                                <tr>
                                    <td>Organizer A</td>
                                    <td>organizer@uni.edu</td>
                                    <td>Organization Lead</td>
                                    <td>CompSci Club</td>
                                    <td><button class="btn-blue btn-sm">Edit</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        function filterUsers(q){ /* implement client-side filter later */ }
    </script>

</body>

</html>
