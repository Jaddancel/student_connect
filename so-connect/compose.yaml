services:
  laravel.test:
    build:
      context: "./docker/8.5"
      dockerfile: Dockerfile
      args:
        WWWGROUP: "${WWWGROUP:-1000}"
    image: "sail-8.5/app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-80}:80"
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
      IGNITION_LOCAL_SITES_PATH: "${PWD}"
    volumes:
      - ".:/var/www/html"
    networks:
      - sail
    depends_on:
      - mysql
  mysql:
    image: "mysql:8.4"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: "${MYSQL_EXTRA_OPTIONS:-}"
    volumes:
      - "sail-mysql:/var/lib/mysql"
      - "./vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh"
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-p${DB_PASSWORD}"
      retries: 3
      timeout: 5s
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - sail
  mailhog:
    image: "mailhog/mailhog:latest"
    ports:
      - "${FORWARD_MAILHOG_PORT:-1025}:1025"
      - "${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025"
    networks:
      - sail
  # PaddleOCR sidecar for the ID-template scanner. Service name MUST be `ocr`
  # to match OCR_SERVICE_URL=http://ocr:5000. First build downloads OCR models.
  ocr:
    build:
      context: "./docker/ocr"
      dockerfile: Dockerfile
    ports:
      - "${OCR_PORT:-5000}:5000"
    networks:
      - sail
  # LibreOffice/unoserver conversion sidecar for DOCX→PDF. Service name MUST be
  # `docxconvert` to match DOCX_CONVERT_URL=http://docxconvert:2003. CPU-only
  # and lightweight; the app falls back to its own `soffice` if this is down.
  docxconvert:
    build:
      context: "./docker/docxconvert"
      dockerfile: Dockerfile
    ports:
      - "${DOCX_CONVERT_PORT:-2003}:2003"
    networks:
      - sail
  # OnlyOffice Document Server — the in-browser DOCX editor behind the form
  # builder's "Printed template" step. Service name MUST be `onlyoffice` to
  # match ONLYOFFICE_INTERNAL_URL=http://onlyoffice.
  #
  # Heavy: upstream recommends 4-8GB RAM, and this image runs its own
  # PostgreSQL, RabbitMQ and Redis internally. If it OOMs, raise the WSL memory
  # cap in %UserProfile%\.wslconfig on the Windows host.
  #
  # The browser loads the editor from ONLYOFFICE_PUBLIC_URL (host-visible),
  # while the server fetches and saves documents over the `sail` network using
  # the app's internal hostname — the two URLs are deliberately different.
  onlyoffice:
    # Built rather than pulled: the stock image lets the user close the docked
    # "Field tokens" plugin panel, which we patch out. See
    # docker/onlyoffice/patch-plugin-panel.sh for why and how.
    build:
      context: ./docker/onlyoffice
    image: so-connect-onlyoffice
    environment:
      # Every request between Laravel and the server is signed; the secret must
      # match ONLYOFFICE_JWT_SECRET on the app side.
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-change-me-to-32-plus-random-characters}"
      JWT_HEADER: "Authorization"
    ports:
      - "${ONLYOFFICE_PORT:-8081}:80"
    volumes:
      - "sail-onlyoffice-data:/var/www/onlyoffice/Data"
      - "sail-onlyoffice-log:/var/log/onlyoffice"
      # No plugin mount: the token palette is served per-form by Laravel and
      # injected through editorConfig.plugins.pluginsData, so it already knows
      # which form's fields to offer. (The Automation API that would let the
      # host page insert tokens directly is Developer-Edition-only.)
    networks:
      - sail
networks:
  sail:
    driver: bridge
volumes:
  sail-mysql:
    driver: local
  sail-onlyoffice-data:
    driver: local
  sail-onlyoffice-log:
    driver: local
