<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recent Registrations - Super Admin</title>
    <link rel="stylesheet" href="../superadmin/css/super.css">
</head>

<body>

    <main class="main" style="width: 100%;">
        <div class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3>Recent Registrations</h3>
            </div>
            <a href="super_dashboard.html" class="btn-blue" style="text-decoration: none; padding: 8px 16px; border-radius: 6px; display: inline-block; color: white;">← Back to Dashboard</a>
        </div>

            <section class="grid">
                <div class="card" style="grid-column: 1 / -1;">
                    <h3>Pending Registrations</h3>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Organization</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recentRegs">
                                <tr>
                                    <td>Jane Doe</td>
                                    <td>jane@example.com</td>
                                    <td>CompSci Club</td>
                                    <td>Pending</td>
                                    <td>
                                        <div class="action-buttons">
                                            <button class="approve small" title="Approve">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                                    <path d="M20 6L9 17L4 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                            </button>

                                            <button class="reject small" title="Reject">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                                    <path d="M18 6L6 18M6 6l12 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

    </main>

</body>

</html>
